<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Non-Metal Element Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, rgb(73, 73, 223), rgb(0, 11, 128));
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    nav {
      background-color: #23395d;
      color: white;
      padding: 10px 20px;
    }
    nav a,
    .navbar-brand {
      color: white;
      text-decoration: none;
    }
    nav a:hover,
    .navbar-brand:hover {
      color: #dbe7ff;
    }
    .navbar-toggler {
      border: 1px solid white;
    }
    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255,255,255,1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }
    .main-card {
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      overflow: hidden;
      max-width: 450px;
      margin: 80px auto;
    }
    .page-header {
      background-color: rgb(5, 5, 5);
      color: white;
      padding: 25px;
      text-align: center;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Campus ICT10</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#elementMenu"
        aria-controls="elementMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="elementMenu">
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="index.html">Home</a>
          <a class="nav-link text-white" href="element.html">Element Checker</a>
          <a class="nav-link text-white" href="marching.html">Marching Band</a>
          <a class="nav-link text-white" href="creator.html">Meet the Creator</a>
        </div>
      </div>
    </div>
  </nav>
  <div class="card main-card">
    <div class="page-header">
      <h2>Non-Metal Element Finder</h2>
    </div>
    <div class="card-body">
      <h5 class="mb-3">Input your element symbol</h5>
      <form onsubmit="return false">
        <label for="elementInput" class="form-label">Enter an element symbol:</label>
        <input id="elementInput" type="text" class="form-control" placeholder="Example: O">
        <button type="button" py-click="find_element" class="btn btn-success mt-3 w-100">Check Details</button>
      </form>
      <div id="result" class="mt-4 text-dark"></div>
    </div>
  </div>
  <script type="py" src="./element.py"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
